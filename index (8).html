<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal - Send & Receive Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 font-sans">
    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-2xl">P</div>
                <span class="text-3xl font-bold text-blue-600">PayPal</span>
            </div>
            
            <div class="hidden md:flex items-center gap-8">
                <a href="#" onclick="showSection('home')" class="font-medium hover:text-blue-600">Home</a>
                <a href="#" onclick="showLogin()" class="font-medium hover:text-blue-600">Login</a>
                <a href="#" onclick="showSignup()" class="font-medium hover:text-blue-600">Sign Up</a>
            </div>
            
            <div id="user-nav" class="hidden items-center gap-4">
                <span id="nav-username" class="font-medium"></span>
                <button onclick="logout()" class="text-sm px-5 py-2 border border-red-500 text-red-500 rounded-xl hover:bg-red-50">Logout</button>
            </div>
        </div>
    </nav>

    <!-- HOME SECTION -->
    <section id="home-section" class="section">
        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white py-24">
            <div class="max-w-5xl mx-auto px-6 text-center">
                <h1 class="text-6xl font-bold mb-6">Send Money. Get Paid.<br>Securely.</h1>
                <p class="text-2xl mb-10">The safer, easier way to send and receive money worldwide.</p>
                <button onclick="showSignup()" 
                        class="bg-white text-blue-600 px-10 py-4 rounded-2xl text-xl font-semibold hover:bg-blue-50">
                    Get Started for Free
                </button>
            </div>
        </div>
    </section>

    <!-- LOGIN SECTION -->
    <section id="login-section" class="section hidden max-w-md mx-auto px-6 py-20">
        <div class="bg-white rounded-3xl shadow-xl p-10">
            <h2 class="text-3xl font-bold text-center mb-8">Log in to PayPal</h2>
            <input id="login-email" type="email" placeholder="Email or Phone" class="w-full p-4 border rounded-2xl mb-4">
            <input id="login-password" type="password" placeholder="Password" class="w-full p-4 border rounded-2xl mb-6">
            <button onclick="login()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-semibold text-lg">Log In</button>
            <p onclick="showForgotPassword()" class="text-blue-600 text-center mt-6 cursor-pointer">Forgot Password?</p>
        </div>
    </section>

    <!-- SIGNUP SECTION -->
    <section id="signup-section" class="section hidden max-w-md mx-auto px-6 py-20">
        <div class="bg-white rounded-3xl shadow-xl p-10">
            <h2 class="text-3xl font-bold text-center mb-8">Create a PayPal Account</h2>
            <input id="signup-name" type="text" placeholder="Full Name" class="w-full p-4 border rounded-2xl mb-4">
            <input id="signup-email" type="email" placeholder="Email Address" class="w-full p-4 border rounded-2xl mb-4">
            <input id="signup-password" type="password" placeholder="Create Password" class="w-full p-4 border rounded-2xl mb-6">
            <button onclick="signup()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-semibold text-lg">Sign Up</button>
        </div>
    </section>

    <!-- DASHBOARD SECTION -->
    <section id="dashboard-section" class="section hidden max-w-7xl mx-auto px-6 py-12">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-4xl font-bold">Welcome back, <span id="username-display"></span></h2>
                <p class="text-gray-500">Manage your money securely</p>
            </div>
            <div class="text-right">
                <p class="text-sm text-gray-500">Available Balance</p>
                <p id="balance" class="text-5xl font-bold text-green-600">$1,248.75</p>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <button onclick="showSendMoneyModal()" class="bg-blue-600 text-white p-8 rounded-3xl hover:bg-blue-700 transition text-left">
                <i class="fa-solid fa-paper-plane text-4xl mb-4"></i>
                <h3 class="text-2xl font-semibold">Send Money</h3>
            </button>
            <button onclick="showReceiveModal()" class="bg-emerald-600 text-white p-8 rounded-3xl hover:bg-emerald-700 transition text-left">
                <i class="fa-solid fa-qrcode text-4xl mb-4"></i>
                <h3 class="text-2xl font-semibold">Request Money</h3>
            </button>
            <button class="bg-gray-800 text-white p-8 rounded-3xl hover:bg-gray-900 transition text-left">
                <i class="fa-solid fa-wallet text-4xl mb-4"></i>
                <h3 class="text-2xl font-semibold">Add Money</h3>
            </button>
        </div>

        <!-- Recent Transactions -->
        <h3 class="font-semibold text-xl mb-6">Recent Activity</h3>
        <div id="transactions-list" class="space-y-4"></div>
    </section>

    <!-- SEND MONEY MODAL -->
    <div id="send-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4">
            <h3 class="text-2xl font-bold mb-6">Send Money</h3>
            <input id="recipient" type="text" placeholder="Email or Username" class="w-full p-4 border rounded-2xl mb-4">
            <input id="amount" type="number" placeholder="Amount ($)" class="w-full p-4 border rounded-2xl mb-6">
            <button onclick="sendMoney()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-semibold">Send Now</button>
            <button onclick="closeModals()" class="mt-3 w-full text-gray-500">Cancel</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
